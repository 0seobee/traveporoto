function parseGmapUrl(url) {
  if (!url) return;
  let lat, lng, name = '';

  // @lat,lng,zoom 형식 (가장 일반적)
  let m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }

  // ?q=lat,lng 형식
  if (!lat) { m = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/); if (m) { lat=parseFloat(m[1]); lng=parseFloat(m[2]); } }

  // ll=lat,lng 형식
  if (!lat) { m = url.match(/ll=(-?\d+\.\d+),(-?\d+\.\d+)/); if (m) { lat=parseFloat(m[1]); lng=parseFloat(m[2]); } }

  // !3d lat !4d lng 형식 (Place ID URL)
  if (!lat) { m = url.match(/!3d(-?\d+\.\d+).*!4d(-?\d+\.\d+)/); if (m) { lat=parseFloat(m[1]); lng=parseFloat(m[2]); } }

  // 장소명 추출 (/maps/place/이름/)
  m = url.match(/maps\/place\/([^/@?]+)/);
  if (m) name = decodeURIComponent(m[1].replace(/\+/g,' ')).replace(/_/g,' ');

  if (lat && lng) {
    document.getElementById('mLat').value = lat.toFixed(6);
    document.getElementById('mLng').value = lng.toFixed(6);
    if (name && !document.getElementById('mName').value) document.getElementById('mName').value = name;
    if (window.leafletMap) window.leafletMap.setView([lat, lng], 16);
  }
}

// ── GALLERY ──
const NICK_KEY = 'trip-nickname';
let galPhotos = [], galLbIndex = 0;

function getNickname(force) {
  let nick = localStorage.getItem(NICK_KEY);
  if (!nick || force) {
    nick = (prompt('사진에 표시할 이름(닉네임)을 입력하세요', nick || '') || '').trim();
    if (!nick) return null;
    localStorage.setItem(NICK_KEY, nick);
  }
  return nick;
}

function galThumb(url) {
  // Cloudinary URL에 썸네일 변환 삽입: /upload/ → /upload/w_400,c_limit,q_auto,f_auto/
  return url.replace('/upload/', '/upload/w_400,c_limit,q_auto,f_auto/');
}

async function renderGallery(container, tab) {
  galPhotos = await sbGet('photos', `project_id=eq.${currentProject.id}&order=created_at.desc`);
  const nick = localStorage.getItem(NICK_KEY);
  container.innerHTML = `<div class="pane-wrap" id="pw-gal-${tab.id}">
    <div class="pane-header">
      <div class="pane-title">📷 ${tab.title}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="badge">${galPhotos.length}장</span>
      </div>
    </div>
    <div class="gal-toolbar">
      <input type="file" id="galFile" accept="image/*" multiple style="display:none" onchange="uploadGalPhotos(this)">
      <button class="gal-upload-btn" id="galUpBtn" onclick="galPickFiles()">📤 사진 올리기</button>
      <span class="gal-progress" id="galProgress"></span>
      <span style="flex:1"></span>
      ${nick ? `<span class="gal-nick">업로더: <b>${nick}</b> <button class="gal-nick-change" onclick="changeNickname()">변경</button></span>` : ''}
    </div>
    <div class="gal-grid scroll-list" id="galGrid">${galPhotos.map((p, i) => `
      <div class="gal-item" onclick="openGalLb(${i})">
        <img src="${p.thumb_url || galThumb(p.url)}" alt="${p.caption || ''}" loading="lazy">
        <button class="gal-item-del" title="삭제" onclick="event.stopPropagation();deleteGalPhoto('${p.id}')">🗑️</button>
        <div class="gal-item-info">
          <span class="gal-item-nick">${p.nickname}</span>

      </div>`).join('')}

    ${!galPhotos.length ? `<div class="empty-state"><div class="icon">📷</div><p>여행 사진을 올려 함께 공유해 보세요</p></div>` : ''}
    <div class="gal-lightbox" id="galLb" onclick="if(event.target===this)closeGalLb()">
      <button class="gal-lb-close" onclick="closeGalLb()">✕</button>
      <button class="gal-lb-nav prev" onclick="navGalLb(-1)">‹</button>
      <img id="galLbImg" src="">
      <div class="gal-lb-meta" id="galLbMeta"></div>
      <button class="gal-lb-nav next" onclick="navGalLb(1)">›</button>
    </div>
  </div>`;
}

function galPickFiles() {
  if (!getNickname()) return;
  document.getElementById('galFile').click();
}

function changeNickname() {
  if (getNickname(true)) renderGallery(document.getElementById('tabContent'), currentTab);
}

async function uploadGalPhotos(input) {
  const files = [...input.files];
  if (!files.length) return;
  const nick = getNickname();
  if (!nick) return;
  const btn = document.getElementById('galUpBtn');
  const prog = document.getElementById('galProgress');
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const file of files) {
    prog.textContent = `업로드 중… ${done + 1}/${files.length}`;
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', CLD_PRESET);
      // 여행별 폴더 분리: trips/<여행이름>
      const folderName = (currentProject.name || currentProject.id).replace(/[\\/?%*:|"<>]/g, '').trim();
      fd.append('folder', `trips/${folderName}`);
      const r = await fetch(`https://api.cloudinary.com/v1_1/${CLD_NAME}/image/upload`, { method: 'POST', body: fd });
      if (!r.ok) throw new Error(await r.text());
      const j = await r.json();
      await sbPost('photos', {
        project_id: currentProject.id,
        url: j.secure_url,
        thumb_url: galThumb(j.secure_url),
        nickname: nick
      });
      done++;
    } catch (err) {
      console.error('업로드 실패:', err);
      failed++;
    }
  }
  btn.disabled = false;
  prog.textContent = failed ? `⚠️ ${done}장 성공, ${failed}장 실패` : '';
  input.value = '';
  await renderGallery(document.getElementById('tabContent'), currentTab);
}

async function deleteGalPhoto(id) {
  if (!confirm('이 사진을 삭제하시겠습니까?')) return;
  await sbDelete('photos', id);
  await renderGallery(document.getElementById('tabContent'), currentTab);
}

function openGalLb(i) {
  galLbIndex = i;
  updateGalLb();
  document.getElementById('galLb').classList.add('open');
}
function closeGalLb() { document.getElementById('galLb').classList.remove('open'); }
function navGalLb(d) {
  galLbIndex = (galLbIndex + d + galPhotos.length) % galPhotos.length;
  updateGalLb();
}
function updateGalLb() {
  const p = galPhotos[galLbIndex];
  if (!p) return;
  document.getElementById('galLbImg').src = p.url;
  document.getElementById('galLbMeta').innerHTML =
    `<span class="nick">${p.nickname}</span> · ${(p.created_at || '').slice(0, 10)} · ${galLbIndex + 1}/${galPhotos.length}`;
}

// ── Common Delete ──
async function deleteItem(id, tabId) {
  if (!confirm('삭제하시겠습니까?')) return;
  await sbDelete('tab_items', id);
  const tab = currentTab;
  const items = await sbGet('tab_items', `tab_id=eq.${tabId}&order=sort_order.asc,created_at.asc`);
  const container = document.getElementById('tabContent');
  if (tab.type === 'schedule') renderSchedItems(items, currentSchedDate);
  else if (tab.type === 'checklist') renderChecklist(container, tab, items);
  else if (tab.type === 'list') renderList(container, tab, items);
  else if (tab.type === 'card') renderCards(container, tab, items);
  else if (tab.type === 'map') renderMap(container, tab, items);
  else if (tab.type === 'file') renderFiles(container, tab, items);
  else if (tab.type === 'budget') renderBudget(container, tab, items);
  else if (tab.type === 'table') renderTable(container, tab, items);
  else if (tab.type === 'flight') renderFlight(container, tab, items);
  else if (tab.type === 'slides') renderSlides(container, tab);
}

// ── BUDGET ──
function calcBudget(items, currency) {
  const rows = items.filter(i => i.data.currency === currency);
  const income = rows.filter(i=>i.data.type==='in').reduce((s,i)=>s+parseFloat((i.data.amount||'0').replace(/,/g,'')),0);
  const expense = rows.filter(i=>i.data.type==='out').reduce((s,i)=>s+parseFloat((i.data.amount||'0').replace(/,/g,'')),0);
  return { income, expense, balance: income - expense };
}

// ── SLIDES ──
function renderSlides(container, tab) {
  const cfg = tab.config || {};
  const dir = cfg.slideDir || 'slides/shamon';
  const total = cfg.slideCount || 19;
  let cur = 1;

  container.innerHTML = `<div class="slide-viewer">
    <div class="slide-stage" id="slideStage">
      <button class="slide-nav slide-prev" onclick="slideMov(-1)">‹</button>
      <img id="slideImg" src="${dir}/slide-1.png" alt="슬라이드 1">
      <button class="slide-nav slide-next" onclick="slideMov(1)">›</button>
      <div class="slide-counter"><span id="slideCur">1</span> / ${total}</div>
    </div>
    <div class="slide-thumbs" id="slideThumbs">
      ${Array.from({length:total},(_,i)=>
        `<img class="slide-thumb${i===0?' on':''}" src="${dir}/slide-${i+1}.png" alt="${i+1}" onclick="slideGo(${i+1})">`
      ).join('')}
    </div>
  </div>`;

  window._slideTotal = total;
  window._slideDir = dir;
  window._slideCur = 1;

  // 키보드 화살표
  container._slideKeyHandler = e => {
    if (e.key === 'ArrowRight') slideMov(1);
    if (e.key === 'ArrowLeft')  slideMov(-1);
  };
  document.addEventListener('keydown', container._slideKeyHandler);
}

window.slideMov = function(d) {
  const total = window._slideTotal || 19;
  window._slideCur = Math.max(1, Math.min(total, (window._slideCur||1) + d));
  slideGo(window._slideCur);
};

window.slideGo = function(n) {
  window._slideCur = n;
  const img = document.getElementById('slideImg');
  const cur = document.getElementById('slideCur');
  const thumbs = document.querySelectorAll('.slide-thumb');
  if (!img) return;
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = `${window._slideDir}/slide-${n}.png`;
    img.alt = `슬라이드 ${n}`;
    img.style.opacity = '1';
  }, 120);
  if (cur) cur.textContent = n;
  thumbs.forEach((t,i) => t.classList.toggle('on', i+1===n));
  // 썸네일 스크롤
  const activeThumb = thumbs[n-1];
  if (activeThumb) activeThumb.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
};

const BUDGET_SYM = { krw:'₩', eur:'€', usd:'$', jpy:'¥', cny:'CN¥' };
const BUDGET_LABEL = { krw:'원화 (KRW)', eur:'유로 (EUR)', usd:'달러 (USD)', jpy:'엔화 (JPY)', cny:'위안화 (CNY)' };
const BUDGET_CUR_OPTS = `<option value="krw">₩ 원화</option><option value="eur">€ 유로</option><option value="usd">$ 달러</option><option value="jpy">¥ 엔화</option><option value="cny">CN¥ 위안화</option>`;

function renderBudget(container, tab, items) {
  const sym = BUDGET_SYM;
  const metaItem = items.find(i => i.data.__meta);
  const peopleCount = Math.max(1, parseInt(metaItem?.data.peopleCount) || 1);
  const pinned = (metaItem?.data.pinned && metaItem.data.pinned.length) ? metaItem.data.pinned : ['krw','eur'];
  const curs = Array.from(new Set([...pinned, ...items.map(i=>i.data.currency).filter(Boolean)])).filter(c=>sym[c]);

  const summaryHtml = curs.map(cur => {
    const { income, expense, balance } = calcBudget(items, cur);
    const label = BUDGET_LABEL[cur];
    const balColor = balance >= 0 ? '#a5d6a7' : '#ef9a9a';
    const perPerson = Math.round(expense / peopleCount);
    const curCount = items.filter(i=>i.data.currency===cur).length;
    const labelHtml = (curCount === 0 && pinned.includes(cur))
      ? `<select class="f-sel" style="font-size:11px;font-weight:800;padding:3px 6px" onchange="changePinnedCurrency('${tab.id}','${cur}',this.value)">${BUDGET_CUR_OPTS.replace(`value="${cur}"`, `value="${cur}" selected`)}</select>`
      : `<span style="font-size:12px;font-weight:800;color:var(--sub)">${label}</span>`;
    return `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;flex:1;min-width:220px">
      <div style="margin-bottom:10px">${labelHtml}</div>
      <div style="display:flex;gap:16px;font-size:13px;flex-wrap:wrap">
        <div><div style="color:var(--sub);font-size:11px">입금</div><div style="color:#a5d6a7;font-weight:700">${sym[cur]}${income.toLocaleString()}</div></div>
        <div><div style="color:var(--sub);font-size:11px">출금</div><div style="color:#ef9a9a;font-weight:700">${sym[cur]}${expense.toLocaleString()}</div></div>
        <div><div style="color:var(--sub);font-size:11px">잔액</div><div style="color:${balColor};font-weight:800">${sym[cur]}${balance.toLocaleString()}</div></div>
        <div><div style="color:var(--sub);font-size:11px">1인당 예상</div><div style="color:#ffb74d;font-weight:800">${sym[cur]}${perPerson.toLocaleString()}</div></div>
      </div>
    </div>`;
  }).join('');

  const rowsHtml = curs.map(cur => {
    const psId = `ps-bg-${tab.id}-${cur}`;
    const curItems = items.filter(i=>i.data.currency===cur);
    const label = (curItems.length === 0 && pinned.includes(cur))
      ? `<select class="f-sel" style="font-size:11px;font-weight:800;padding:3px 6px" onclick="event.stopPropagation()" onchange="event.stopPropagation();changePinnedCurrency('${tab.id}','${cur}',this.value)">${BUDGET_CUR_OPTS.replace(`value="${cur}"`, `value="${cur}" selected`)}</select>`
      : `${sym[cur]} ${BUDGET_LABEL[cur]}`;
    const inRows = curItems.filter(i=>i.data.type==='in');
    const outRows = curItems.filter(i=>i.data.type==='out');
    const bEditTd = (item, field, style='') => `<td class="list-editable" style="${style}" contenteditable="true" spellcheck="false"
        onblur="saveBudgetCell(event,'${item.id}','${tab.id}','${field}')"
        onkeydown="if(event.key==='Enter'){event.preventDefault();event.target.blur();}"
      >${item.data[field]||''}</td>`;
    const mkRows = arr => arr.map(item=>`
      <tr class="budget-row" data-id="${item.id}">
        <td class="budget-drag-handle" title="드래그해서 이동">⠿</td>
        <td><select class="f-sel" style="font-size:11px;padding:4px 6px" onchange="saveBudgetCurrency('${item.id}','${tab.id}',this.value)">${BUDGET_CUR_OPTS.replace(`value="${cur}"`, `value="${cur}" selected`)}</select></td>
        ${bEditTd(item,'date')}
        ${bEditTd(item,'item')}
        <td style="color:${item.data.type==='in'?'#a5d6a7':'#ef9a9a'};font-weight:700">${sym[cur]}<span class="list-editable" contenteditable="true" spellcheck="false"
            onblur="saveBudgetCell(event,'${item.id}','${tab.id}','amount')"
            onkeydown="if(event.key==='Enter'){event.preventDefault();event.target.blur();}"
          >${item.data.amount ? Number(String(item.data.amount).replace(/,/g,'')).toLocaleString() : ''}</span></td>
        ${bEditTd(item,'note','color:var(--sub)')}
        <td><button class="del-btn" onclick="deleteItem('${item.id}','${tab.id}')">삭제</button></td>
      </tr>`).join('');
    return `<div class="ps" id="${psId}">
      <div class="ps-header" onclick="togglePS('${psId}')">
        <span class="ps-title">${label}</span>
        <span class="ps-count">${curItems.length}건</span>
        <span class="ps-arrow">▼</span>
      </div>
      <div class="ps-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 4px">
          <div>
            <div style="font-size:11px;font-weight:700;color:#a5d6a7;margin-bottom:6px">▶ 입금</div>
            <div class="scroll-list"><table class="list-table"><thead><tr><th></th><th>통화</th><th>날짜</th><th>항목</th><th>금액</th><th>비고</th><th></th></tr></thead><tbody class="budget-tbody" data-tab="${tab.id}" data-cur="${cur}" data-type="in">${mkRows(inRows)}</tbody></table></div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:700;color:#ef9a9a;margin-bottom:6px">◀ 출금</div>
            <div class="scroll-list"><table class="list-table"><thead><tr><th></th><th>통화</th><th>날짜</th><th>항목</th><th>금액</th><th>비고</th><th></th></tr></thead><tbody class="budget-tbody" data-tab="${tab.id}" data-cur="${cur}" data-type="out">${mkRows(outRows)}</tbody></table></div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `<div class="pane-wrap" id="pw-budget-${tab.id}">
    <div class="pane-header">
      <div class="pane-title">💰 ${tab.title}</div>
      <div style="display:flex;align-items:center;gap:10px">
        <label style="font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px">인원 수
          <input class="f-inp" id="bPeople-${tab.id}" type="number" min="1" value="${peopleCount}"
            style="width:56px;padding:5px 8px" onchange="saveBudgetPeople('${tab.id}',this.value)">명
        </label>
        <button class="pane-collapse-btn" onclick="toggleAllPS('pw-budget-${tab.id}',this)">접기 ▲</button>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">${summaryHtml}</div>
    <div class="ps" id="ps-bf-${tab.id}">
      <div class="ps-header" onclick="togglePS('ps-bf-${tab.id}')">
        <span class="ps-title">＋ 내역 추가</span>
        <span class="ps-arrow">▼</span>
      </div>
      <div class="ps-body">
        <div class="form-box" style="border:none;border-radius:0;margin:0">
          <div class="form-row">
            <select class="f-sel" id="bCur">${BUDGET_CUR_OPTS}</select>
            <select class="f-sel" id="bType"><option value="in">▶ 입금</option><option value="out">◀ 출금</option></select>
            <input class="f-inp" id="bDate" type="date">
            <input class="f-inp" id="bItem" placeholder="항목 *">
          </div>
          <div class="form-row">
            <input class="f-inp" id="bAmount" placeholder="금액 *">
            <input class="f-inp" id="bNote" placeholder="비고">
            <button class="f-btn" onclick="addBudgetItem('${tab.id}')">추가</button>
          </div>
        </div>
      </div>
    </div>
    ${rowsHtml}
  </div>`;
  initPS([`ps-bf-${tab.id}`, ...curs.map(c=>`ps-bg-${tab.id}-${c}`)]);
  initBudgetDrag(container);
}

// ── 입금/출금 행 드래그 이동 (Pointer Events — 마우스 + 터치 공용) ──
function initBudgetDrag(container) {
  let dragRow = null, activePointerId = null, longPressTimer = null;
  let startX = 0, startY = 0, isTouch = false, moved = false;

  const rows = container.querySelectorAll('.budget-row');

  function endDrag() {
    if (!dragRow) return;
    const tbody = dragRow.closest('.budget-tbody');
    dragRow.classList.remove('dragging');
    dragRow.style.touchAction = 'pan-y';
    const newType = tbody.dataset.type;
    const tabId = tbody.dataset.tab;
    const itemId = dragRow.dataset.id;
    dragRow = null;
    saveBudgetRowMove(itemId, tabId, newType);
  }

  rows.forEach(row => {
    row.style.touchAction = 'pan-y';

    row.addEventListener('pointerdown', e => {
      if (!e.target.closest('.budget-drag-handle')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      isTouch = e.pointerType !== 'mouse';
      startX = e.clientX; startY = e.clientY; moved = false;
      activePointerId = e.pointerId;
      clearTimeout(longPressTimer);
      const start = () => {
        moved = true;
        dragRow = row;
        row.classList.add('dragging');
        row.style.touchAction = 'none';
        try { row.setPointerCapture(e.pointerId); } catch (err) {}
      };
      if (isTouch) longPressTimer = setTimeout(start, 150);
      else start();
    });

    row.addEventListener('pointermove', e => {
      if (activePointerId === null || e.pointerId !== activePointerId) return;
      if (!dragRow) return;
      e.preventDefault();
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const overRow = el?.closest('.budget-row');
      const overTbody = el?.closest('.budget-tbody');
      if (overRow && overRow !== dragRow) {
        const rect = overRow.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        overRow.parentElement.insertBefore(dragRow, after ? overRow.nextSibling : overRow);
      } else if (overTbody && !overTbody.contains(dragRow)) {
        overTbody.appendChild(dragRow);
      }
    });

    ['pointerup', 'pointercancel'].forEach(evt => row.addEventListener(evt, e => {
      if (activePointerId === null || e.pointerId !== activePointerId) return;
      clearTimeout(longPressTimer);
      try { row.releasePointerCapture(e.pointerId); } catch (err) {}
      activePointerId = null;
      if (dragRow) endDrag();
    }));
  });
}

async function saveBudgetRowMove(itemId, tabId, newType) {
  const item = await sbGet('tab_items', `id=eq.${itemId}`);
  if (!item[0]) return;
  if (item[0].data.type !== newType) {
    await sbPatch('tab_items', itemId, { data: { ...item[0].data, type: newType } });
  }
  const tab = currentTab;
  const items = await sbGet('tab_items', `tab_id=eq.${tabId}&order=sort_order.asc,created_at.asc`);
  renderBudget(document.getElementById('tabContent'), tab, items);
}

async function changePinnedCurrency(tabId, oldCur, newCur) {
  if (oldCur === newCur) return;
  const metas = await sbGet('tab_items', `tab_id=eq.${tabId}&data->>__meta=eq.true`);
  const meta = metas[0];
  const pinned = (meta?.data.pinned && meta.data.pinned.length) ? [...meta.data.pinned] : ['krw','eur'];
  const idx = pinned.indexOf(oldCur);
  if (idx >= 0) pinned[idx] = newCur; else pinned.push(newCur);
  if (meta) {
    await sbPatch('tab_items', meta.id, { data: { ...meta.data, pinned } });
  } else {
    await sbPost('tab_items', { tab_id: tabId, data: { __meta: true, pinned }, sort_order: -1 });
  }
  const tab = currentTab;
  const items = await sbGet('tab_items', `tab_id=eq.${tabId}&order=sort_order.asc,created_at.asc`);
  renderBudget(document.getElementById('tabContent'), tab, items);
}

async function saveBudgetCurrency(id, tabId, newCur) {
  const item = await sbGet('tab_items', `id=eq.${id}`);
  if (!item[0]) return;
  await sbPatch('tab_items', id, { data: { ...item[0].data, currency: newCur } });
  const tab = currentTab;
  const items = await sbGet('tab_items', `tab_id=eq.${tabId}&order=sort_order.asc,created_at.asc`);
  renderBudget(document.getElementById('tabContent'), tab, items);
}

async function saveBudgetPeople(tabId, value) {
  const n = Math.max(1, parseInt(value) || 1);
  const metas = await sbGet('tab_items', `tab_id=eq.${tabId}&data->>__meta=eq.true`);
  if (metas[0]) {
    await sbPatch('tab_items', metas[0].id, { data: { ...metas[0].data, peopleCount: n } });
  } else {
    await sbPost('tab_items', { tab_id: tabId, data: { __meta: true, peopleCount: n }, sort_order: -1 });
  }
  const tab = currentTab;
  const items = await sbGet('tab_items', `tab_id=eq.${tabId}&order=sort_order.asc,created_at.asc`);
  renderBudget(document.getElementById('tabContent'), tab, items);
}

async function addBudgetItem(tabId) {
  const item = document.getElementById('bItem').value.trim();
  const amount = document.getElementById('bAmount').value.replace(/[^0-9.]/g, '').trim();
  if (!item || !amount) { alert('항목과 금액을 입력하세요'); return; }
  const data = {
    currency: document.getElementById('bCur').value,
    type: document.getElementById('bType').value,
    date: document.getElementById('bDate').value,
    item, amount,
    note: document.getElementById('bNote').value.trim()
  };
  await sbPost('tab_items', { tab_id: tabId, data, sort_order: 0 });
  ['bDate','bItem','bAmount','bNote'].forEach(id=>document.getElementById(id).value='');
  const tab = currentTab;
  const items = await sbGet('tab_items', `tab_id=eq.${tabId}&order=sort_order.asc,created_at.asc`);
  renderBudget(document.getElementById('tabContent'), tab, items);
}
